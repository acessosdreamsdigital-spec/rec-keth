<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Differs — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#f1f5f9;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;border-radius:20px;padding:48px;width:100%;max-width:400px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 20px 60px rgba(0,0,0,.06)}
h1{font-size:22px;font-weight:800;color:#0f172a;margin-bottom:4px}
.sub{font-size:14px;color:#94a3b8;margin-bottom:32px}
label{display:block;font-size:12px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
input{width:100%;padding:12px 16px;border:1px solid #e2e8f0;border-radius:12px;font-size:15px;font-family:inherit;margin-bottom:16px;transition:border-color .15s}
input:focus{outline:none;border-color:#0056D2}
.btn{width:100%;padding:14px;background:#0056D2;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s}
.btn:hover{background:#0045b0}
.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none}
</style>
</head>
<body>
<div class="card">
<h1>The Differs Company</h1>
<p class="sub">Faça login para acessar o dashboard</p>
<div class="error" id="error"></div>
<form onsubmit="login(event)">
<label>Email</label>
<input type="email" id="email" placeholder="seu@email.com" required>
<label>Senha</label>
<input type="password" id="password" placeholder="Sua senha" required>
<button type="submit" class="btn" id="btn">Entrar</button>
</form>
</div>
<script>
async function login(e){
e.preventDefault();
const email = document.getElementById('email').value;
const password = document.getElementById('password').value;
document.getElementById('btn').textContent = 'Entrando...';
document.getElementById('btn').disabled = true;
document.getElementById('error').style.display = 'none';

try{
const r = await fetch('/auth/login', {
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({email,password})
});
if(!r.ok){const err=await r.json();throw new Error(err.detail||'Credenciais inválidas')}
const data = await r.json();
localStorage.setItem('ddi_token', data.access_token);
localStorage.setItem('ddi_user', email);
window.location.href = '/dashboard/';
}catch(err){
document.getElementById('error').textContent = err.message;
document.getElementById('error').style.display = 'block';
document.getElementById('btn').textContent = 'Entrar';
document.getElementById('btn').disabled = false;
}
}

document.getElementById('email').value = localStorage.getItem('ddi_user')||'';
</script>
</body>
</html>
