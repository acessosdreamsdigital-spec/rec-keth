<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Differs Company — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;background:#f1f5f9;color:#0f172a}
main{max-width:1440px;margin:0 auto;padding:24px 32px}
.glass-panel{background:#fff;border:1px solid rgba(0,0,0,.04);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
h3{font-size:24px;font-weight:900;letter-spacing:-.02em}
h5{font-size:18px;font-weight:800;letter-spacing:-.01em}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.badge-active{background:#dbeafe;color:#1e40af}.badge-converted{background:#d1fae5;color:#065f46}
.badge-exhausted{background:#f1f5f9;color:#475569}.badge-cancelled{background:#fee2e2;color:#991b1b}
.badge-paused{background:#fef3c7;color:#92400e}.badge-completed{background:#e0e7ff;color:#3730a3}
.badge-opted_out{background:#fce7f3;color:#9d174d}.badge-kiwify{background:#e0f2fe;color:#0369a1}
.badge-assiny{background:#fef3c7;color:#92400e}.badge-abandoned{background:#f1f5f9;color:#475569}
.badge-waiting{background:#fef3c7;color:#92400e}.badge-refused{background:#fee2e2;color:#991b1b}
.temp-quente{background:#fee2e2;color:#dc2626}.temp-morno{background:#fef3c7;color:#d97706}.temp-frio{background:#dbeafe;color:#2563eb}
.ticket-high{background:#ede9fe;color:#7c3aed}.ticket-low{background:#f1f5f9;color:#64748b}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.tab-nav{display:flex;gap:4px;margin-bottom:24px;background:#e2e8f0;border-radius:12px;padding:4px;width:fit-content}
.tab-btn{padding:10px 24px;border:none;background:transparent;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;color:#64748b;transition:all .15s}
.tab-btn.active{background:#fff;color:#0056D2;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tab-content{display:none}.tab-content.active{display:block}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filter-bar input,.filter-bar select{padding:8px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:13px;font-family:inherit;background:#fff}
.filter-bar input:focus,.filter-bar select:focus{outline:none;border-color:#0056D2}
.filter-bar input{min-width:220px}
.btn{padding:8px 18px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-primary{background:#0056D2;color:#fff}.btn-ghost{border:1px solid #e2e8f0;background:#fff;color:#64748b}
.lead-row{cursor:pointer}.lead-row:hover{background:#f8fafc}
.lead-detail{background:#f8fafc;border-top:1px solid #e2e8f0}
.kpi-value{font-size:28px;font-weight:900}.kpi-label{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.sub{font-size:12px;font-weight:600}table{width:100%;border-collapse:collapse}
th{text-align:left;padding:12px 16px;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #e2e8f0}
td{padding:10px 16px;font-size:13px;border-bottom:1px solid #f1f5f9}
.spinner{width:40px;height:40px;border:3px solid #e2e8f0;border-top-color:#0056D2;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="blocker" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(241,245,249,.7);display:flex;align-items:center;justify-content:center;z-index:9999"><div class="spinner"></div></div>
<main>
<header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
<div><h3 style="display:inline">The Differs Company</h3><span style="margin-left:12px;font-size:12px;color:#94a3b8;font-weight:600" id="last-updated">—</span></div>
<button onclick="logout()" style="padding:8px 18px;border:1px solid #e2e8f0;background:#fff;border-radius:10px;font-size:13px;font-weight:600;color:#64748b;cursor:pointer">Sair</button>
</header>

<div class="tab-nav">
<button class="tab-btn active" onclick="switchTab('rec')">📊 Recuperação</button>
<button class="tab-btn" onclick="switchTab('journey')">🛤️ Jornada</button>
</div>

<!-- RECOVERY TAB -->
<div id="tab-rec" class="tab-content active">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px" id="rec-kpi-cards"></div>
<div style="display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:24px">
<div class="glass-panel" style="padding:24px"><h5 style="margin-bottom:16px">Visão Diária</h5><div style="height:200px"><canvas id="chartDaily"></canvas></div></div>
<div class="glass-panel" style="padding:24px"><h5 style="margin-bottom:16px">Sessões Recentes</h5><div id="recent-sessions" style="max-height:300px;overflow-y:auto"></div></div>
</div>
<div style="display:grid;grid-template-columns:7fr 5fr;gap:16px;margin-bottom:24px">
<div class="glass-panel" style="padding:24px"><h5 style="margin-bottom:16px">Performance por Produto</h5><div style="height:180px"><canvas id="chartProducts"></canvas></div></div>
<div class="glass-panel" style="padding:24px"><h5 style="margin-bottom:16px">Funil de Conversão</h5><div style="height:180px"><canvas id="chartFunnel"></canvas></div></div>
</div>
<div class="glass-panel" style="overflow:hidden;margin-bottom:24px">
<div style="padding:12px 20px;border-bottom:1px solid #f1f5f9"><h5>Sessões</h5></div>
<div style="overflow-x:auto"><table><thead><tr><th>Usuário</th><th>Produto</th><th>Plataforma</th><th>Status</th><th>Valor</th><th>Criado</th></tr></thead><tbody id="rec-tbody"></tbody></table></div>
<div style="display:flex;justify-content:space-between;padding:12px 20px;border-top:1px solid #f1f5f9"><span id="rec-pagination" style="font-size:12px;color:#94a3b8"></span><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="recPage(-1)">←</button><button class="btn btn-ghost" onclick="recPage(1)">→</button></div></div>
</div>
</div>

<!-- JOURNEY TAB -->
<div id="tab-journey" class="tab-content">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px" id="j-kpi-1"></div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px" id="j-kpi-2"></div>

<div class="filter-bar">
<input type="text" id="j-search" placeholder="🔍 Buscar nome ou WhatsApp..." oninput="loadJourneyLeads()">
<select id="j-state" onchange="loadJourneyLeads()"><option value="">Todos estados</option></select>
<select id="j-temp" onchange="loadJourneyLeads()"><option value="">Todas temps</option><option value="quente">Quente</option><option value="morno">Morno</option><option value="frio">Frio</option></select>
<select id="j-ticket" onchange="loadJourneyLeads()"><option value="">Todos tickets</option><option value="high">High</option><option value="low">Low</option></select>
</div>

<div style="display:grid;grid-template-columns:5fr 7fr;gap:16px;margin-bottom:24px">
<div class="glass-panel" style="padding:24px"><h5 style="margin-bottom:16px">Temperatura dos Leads</h5><div style="height:180px"><canvas id="chartTemp"></canvas></div></div>
<div class="glass-panel" style="padding:24px"><h5 style="margin-bottom:16px">Distribuição por Produto</h5><div style="height:180px"><canvas id="chartJourneyProducts"></canvas></div></div>
</div>

<div class="glass-panel" style="overflow:hidden;margin-bottom:24px">
<div style="padding:12px 20px;border-bottom:1px solid #f1f5f9"><h5 style="display:inline">Leads</h5><span id="j-count" style="font-size:12px;color:#94a3b8;margin-left:8px"></span></div>
<div style="overflow-x:auto"><table><thead><tr><th>Nome</th><th>WhatsApp</th><th>Estado</th><th>Temp</th><th>Ticket</th><th>Produtos</th><th>Última Resposta</th></tr></thead><tbody id="j-tbody"></tbody></table></div>
<div style="display:flex;justify-content:space-between;padding:12px 20px;border-top:1px solid #f1f5f9"><span id="j-pagination" style="font-size:12px;color:#94a3b8"></span><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="jPage(-1)">←</button><button class="btn btn-ghost" onclick="jPage(1)">→</button></div></div>
</div>
</div>
</main>

<script>
const PRODUCT_NAMES={rec_combo_wow:'Combo Wow',rec_capcut_wow:'CapCut Wow',rec_conteudo_wow:'Conteúdo Wow',rec_mpi:'MPI'};
const STATE_LABELS={ativacao:'Ativação',engajada:'Engajada',fria:'Trilha Fria',acel_feed:'Feed Wow',acel_conteudo:'Conteúdo Wow',acel_mpi:'MPI',acel_manual_ddi:'Manual DDI',acel_formacao_ddi:'Formação DDI',acel_diagnostico:'Diagnóstico',acel_kasulo:'Kasulo',suporte:'Suporte',paused:'Pausada',completed:'Completa',opted_out:'Opt-out'};
const SB={active:'<span class="badge badge-active">Ativa</span>',converted:'<span class="badge badge-converted">Convertida</span>',exhausted:'<span class="badge badge-exhausted">Esgotada</span>',cancelled:'<span class="badge badge-cancelled">Cancelada</span>'};
const JB={active:'<span class="badge badge-active">Ativa</span>',paused:'<span class="badge badge-paused">Pausada</span>',completed:'<span class="badge badge-completed">Completa</span>',opted_out:'<span class="badge badge-opted_out">Opt-out</span>',suporte:'<span class="badge badge-cancelled">Suporte</span>'};
const TB={quente:'<span class="badge temp-quente">Quente</span>',morno:'<span class="badge temp-morno">Morno</span>',frio:'<span class="badge temp-frio">Frio</span>'};
const TKB={high:'<span class="badge ticket-high">High</span>',low:'<span class="badge ticket-low">Low</span>'};
const SLUGS={capcut_wow:'CapCut Wow',conteudo_wow:'Conteúdo Wow',feed_wow:'Feed Wow',formacao_ddi:'Formação DDI',manual_ddi:'Manual DDI',meu_primeiro_infoproduto:'MPI',combo_wow:'Combo Wow',diagnostico:'Diagnóstico',kasulo:'Kasulo'};
let recPg=1,recTp=1,jPg=1,jTp=1,charts={},currentTab='rec',journeyLoaded=false;

function fmtC(c){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format((c||0)/100)}
function fmtD(iso){if(!iso)return'–';return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}
function fmtDy(d){if(!d)return'';const[,m,dd]=d.split('-');return`${dd}/${m}`}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function ini(n){return String(n).split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase()||'?'}
async function F(url){try{const r=await fetch(url);if(!r.ok)return null;return await r.json()}catch(e){return null}}
function lc(mx){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#94a3b8',font:{size:11},boxWidth:10,padding:16}}},scales:{x:{grid:{color:'rgba(0,0,0,.04)'},ticks:{color:'#94a3b8',font:{size:11}},border:{display:false}},y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{color:'#94a3b8',font:{size:11}},border:{display:false},max:mx}}}}

function switchTab(tab){currentTab=tab;document.querySelectorAll('.tab-btn').forEach((b,i)=>{b.classList.toggle('active',(tab==='rec'&&i===0)||(tab==='journey'&&i===1))});document.getElementById('tab-rec').classList.toggle('active',tab==='rec');document.getElementById('tab-journey').classList.toggle('active',tab==='journey');if(tab==='journey'&&!journeyLoaded){journeyLoaded=true;loadJourney()}}

// RECOVERY
async function loadRec(){
const s=await F('/dashboard/stats');if(!s)return;
document.getElementById('rec-kpi-cards').innerHTML=`<div class="glass-panel" style="padding:24px"><div class="kpi-label">Sessões</div><div class="kpi-value">${s.total_sessions}</div><div class="sub" style="color:#0056D2">+${s.active||0} ativas</div></div><div class="glass-panel" style="padding:24px"><div class="kpi-label">Convertidas</div><div class="kpi-value">${s.converted}</div><div class="sub" style="color:#10b981">${s.conversion_rate||0}%</div></div><div class="glass-panel" style="padding:24px"><div class="kpi-label">Receita Total</div><div class="kpi-value">${fmtC(s.total_revenue_cents)}</div><div class="sub" style="color:#64748b">${s.messages_sent} msgs</div></div><div class="glass-panel" style="padding:24px"><div class="kpi-label">Recuperada</div><div class="kpi-value">${fmtC(s.recovered_cents)}</div><div class="sub" style="color:#3b82f6">${s.total_revenue_cents>0?Math.round(s.recovered_cents/s.total_revenue_cents*100):0}%</div></div>`;
const d=await F('/dashboard/daily');if(d){if(charts.daily)charts.daily.destroy();charts.daily=new Chart(document.getElementById('chartDaily').getContext('2d'),{type:'line',data:{labels:d.map(x=>fmtDy(x.day)),datasets:[{label:'Sessões',data:d.map(x=>x.sessions),borderColor:'#0056D2',backgroundColor:'rgba(0,86,210,.06)',fill:true,tension:.4,pointRadius:3},{label:'Convertidas',data:d.map(x=>x.converted),borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.06)',fill:true,tension:.4,pointRadius:3}]},options:lc()})}
const ps=await F('/dashboard/product-stats');if(ps){if(charts.products)charts.products.destroy();charts.products=new Chart(document.getElementById('chartProducts').getContext('2d'),{type:'bar',data:{labels:ps.map(x=>PRODUCT_NAMES[x.template_prefix]||x.template_prefix),datasets:[{label:'Total',data:ps.map(x=>x.total),backgroundColor:'rgba(0,86,210,.15)',borderRadius:6},{label:'Convertidas',data:ps.map(x=>x.converted),backgroundColor:'rgba(16,185,129,.7)',borderRadius:6}]},options:lc()})}
const fn=await F('/dashboard/funnel');if(fn){if(charts.funnel)charts.funnel.destroy();charts.funnel=new Chart(document.getElementById('chartFunnel').getContext('2d'),{type:'bar',data:{labels:fn.map(x=>`Msg ${x.message_number}`),datasets:[{label:'Conversões',data:fn.map(x=>x.converted),backgroundColor:['rgba(0,86,210,.8)','rgba(16,185,129,.8)','rgba(99,102,241,.8)'],borderRadius:8}]},options:lc()})}
await loadRecTbl()}
async function loadRecTbl(){const d=await F(`/dashboard/sessions?page=${recPg}&limit=20`);if(!d)return;recTp=d.pages;document.getElementById('rec-pagination').textContent=`Página ${d.page} de ${d.pages}`;document.getElementById('rec-tbody').innerHTML=(d.data||[]).map(s=>`<tr><td><strong>${esc(s.full_name||'–')}</strong><br><span style="font-size:11px;color:#94a3b8">${esc(s.email||'–')}</span></td><td>${PRODUCT_NAMES[s.template_prefix]||s.product_name}</td><td>${s.platform==='kiwify'?'<span class="badge badge-kiwify">Kiwify</span>':'<span class="badge badge-assiny">Assiny</span>'}</td><td>${SB[s.status]||s.status}</td><td>${s.amount_cents?fmtC(s.amount_cents):'–'}</td><td>${fmtD(s.created_at)}</td></tr>`).join('');const rs=await F('/dashboard/sessions?page=1&limit=6');if(rs)document.getElementById('recent-sessions').innerHTML=(rs.data||[]).slice(0,6).map(s=>`<div class="glass-panel" style="padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px"><div style="width:36px;height:36px;border-radius:50%;background:#e0e7ff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#0056D2">${ini(s.full_name||'?')}</div><div style="flex:1"><div style="font-size:13px;font-weight:700">${esc(s.full_name||'–')}</div><div style="font-size:12px;color:#0056D2">${PRODUCT_NAMES[s.template_prefix]||s.product_name}</div></div></div>`).join('')}
function recPage(d){const n=recPg+d;if(n<1||n>recTp)return;recPg=n;loadRecTbl()}

// JOURNEY
async function loadJourney(){await Promise.all([loadJStats(),loadJInsights(),loadJProducts(),loadJourneyLeads()])}
async function loadJStats(){const s=await F('/dashboard/journey/stats');if(!s)return;document.getElementById('j-kpi-1').innerHTML=`<div class="glass-panel" style="padding:24px"><div class="kpi-label">Jornadas Ativas</div><div class="kpi-value">${s.active}</div><div class="sub" style="color:#0056D2">${s.paused} pausadas</div></div><div class="glass-panel" style="padding:24px"><div class="kpi-label">Total Jornadas</div><div class="kpi-value">${s.total_journeys}</div><div class="sub" style="color:#64748b">${s.completed} completas</div></div><div class="glass-panel" style="padding:24px"><div class="kpi-label">Mensagens Enviadas</div><div class="kpi-value">${s.total_messages_sent}</div><div class="sub" style="color:#10b981">${s.completion_rate}% conclusão</div></div><div class="glass-panel" style="padding:24px"><div class="kpi-label">Suporte / Opt-out</div><div class="kpi-value">${s.suporte+s.opted_out}</div><div class="sub" style="color:#ef4444">${s.suporte} sup / ${s.opted_out} out</div></div>`}
async function loadJInsights(){const i=await F('/dashboard/journey/insights');if(!i)return;document.getElementById('j-kpi-2').innerHTML=`<div class="glass-panel" style="padding:24px"><div class="kpi-label">Leads Analisados</div><div class="kpi-value">${i.total_analyzed}</div><div class="sub" style="color:#7c3aed">GPT-4.1 Mini</div></div><div class="glass-panel" style="padding:24px"><div class="kpi-label">Quentes</div><div class="kpi-value" style="color:#ef4444">${i.temperatura.quente}</div></div><div class="glass-panel" style="padding:24px"><div class="kpi-label">High Ticket</div><div class="kpi-value" style="color:#7c3aed">${i.ticket.high}</div></div>`;if(charts.temp)charts.temp.destroy();charts.temp=new Chart(document.getElementById('chartTemp').getContext('2d'),{type:'doughnut',data:{labels:['Quente','Morno','Frio'],datasets:[{data:[i.temperatura.quente,i.temperatura.morno,i.temperatura.frio],backgroundColor:['#ef4444','#f59e0b','#3b82f6'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{padding:16,font:{size:11}}}}}})}
async function loadJProducts(){const p=await F('/dashboard/journey/products');if(!p||!p.length)return;if(charts.jprod)charts.jprod.destroy();charts.jprod=new Chart(document.getElementById('chartJourneyProducts').getContext('2d'),{type:'bar',indexAxis:'y',data:{labels:p.map(x=>SLUGS[x.product]||x.product),datasets:[{label:'Jornadas',data:p.map(x=>x.journeys),backgroundColor:'rgba(0,86,210,.6)',borderRadius:4},{label:'Compras',data:p.map(x=>x.purchases),backgroundColor:'rgba(16,185,129,.6)',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:11},boxWidth:10}}},scales:{x:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:10}}},y:{grid:{display:false},ticks:{font:{size:11}}}}}})}
async function loadJourneyLeads(){const p={page:jPg,limit:20};const s=document.getElementById('j-search').value.trim();if(s)p.search=s;const st=document.getElementById('j-state').value;if(st)p.state=st;const t=document.getElementById('j-temp').value;if(t)p.temperatura=t;const tk=document.getElementById('j-ticket').value;if(tk)p.ticket=tk;const qs=new URLSearchParams(p).toString();const d=await F('/dashboard/journey/leads?'+qs);if(!d)return;jTp=d.pages;document.getElementById('j-count').textContent=`${d.total} leads`;document.getElementById('j-pagination').textContent=`Página ${d.page} de ${d.pages}`;document.getElementById('j-tbody').innerHTML=(d.data||[]).map(l=>{const tags=(l.tags||[]).slice(0,3).map(t=>`<span class="badge badge-active" style="margin:1px;font-size:10px">${t}</span>`).join('')||'–';const prods=(l.purchased_products||[]).slice(0,2).map(p=>SLUGS[p]||p).join(', ')||'–';return`<tr class="lead-row" onclick="tLead('${l.phone}')"><td><strong>${esc(l.full_name||'–')}</strong></td><td>${l.phone}</td><td>${JB[l.status]||l.status}</td><td>${TB[l.temperatura]||'<span style="color:#94a3b8">–</span>'}</td><td>${TKB[l.ticket]||'<span style="color:#94a3b8">–</span>'}</td><td>${prods}</td><td>${fmtD(l.last_response_at)}</td></tr><tr id="d-${l.phone}" class="lead-detail" style="display:none"><td colspan="7"><div style="display:flex;gap:24px;flex-wrap:wrap"><div style="flex:1;min-width:180px"><strong>Dores:</strong><p style="font-size:13px;color:#475569;margin-top:4px">${(l.dores||[]).join(', ')||'Nenhuma registrada'}</p></div><div style="flex:1;min-width:180px"><strong>Ambições:</strong><p style="font-size:13px;color:#475569;margin-top:4px">${(l.ambicoes||[]).join(', ')||'Nenhuma registrada'}</p></div><div style="flex:1;min-width:180px"><strong>Perfil:</strong><p style="font-size:13px;color:#475569;margin-top:4px">${esc(l.perfil||'Não analisado')}</p></div><div style="flex:1;min-width:150px"><strong>Tags:</strong><div style="margin-top:4px">${tags}</div><div style="margin-top:8px"><strong>D+${l.day_offset||0}</strong> · ${STATE_LABELS[l.current_state]||l.current_state}</div></div></div></td></tr>`}).join('')}
function tLead(p){const r=document.getElementById('d-'+p);if(r)r.style.display=r.style.display==='none'?'':''}
function jPage(d){const n=jPg+d;if(n<1||n>jTp)return;jPg=n;loadJourneyLeads()}

// AUTH
function getToken(){return localStorage.getItem('ddi_token')||''}
function logout(){localStorage.removeItem('ddi_token');window.location.href='/login'}
async function checkAuth(){
const t=getToken();if(!t){window.location.href='/login';return false}
try{const r=await fetch('/auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t})});if(!r.ok)throw new Error();return true}catch(e){logout();return false}
}

// INIT
document.addEventListener('DOMContentLoaded',async ()=>{
const ok=await checkAuth();if(!ok)return;
document.getElementById('j-state').innerHTML='<option value="">Todos estados</option>'+Object.entries(STATE_LABELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
loadRec();document.getElementById('blocker').style.display='none';
setInterval(()=>{document.getElementById('last-updated').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})},30000)});
</script>
</body>
</html>
